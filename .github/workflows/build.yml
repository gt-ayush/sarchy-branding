name: Build sarchy-branding package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm --needed base-devel git fakeroot

      - name: Create non-root build user
        run: |
          useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Build package with makepkg
        run: sudo -u builder makepkg --skipinteg -sf
        working-directory: ${{ github.workspace }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarchy-branding-package
          path: |
            *.pkg.tar.zst
            *.pkg.tar.zst.sig
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: sarchy-branding-package
          path: dist

      - name: Upload package to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pkg.tar.zst
