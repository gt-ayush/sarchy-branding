name: Build and Release sarchy-branding

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    permissions:
      contents: write
    steps:
      - name: Initialize Pacman & Install Dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed base-devel git fakeroot sudo tar zstd

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git user (gt-ayush)
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global user.name "gt-ayush"
          git config --global user.email "gt-ayush@outlook.com"

      - name: Generate date-based version
        id: version
        run: |
          DATE=$(date +%Y.%m.%d)
          TAG="v${DATE}"
          PKGREL=1
          while git rev-parse "${TAG}-${PKGREL}" >/dev/null 2>&1; do
            PKGREL=$((PKGREL + 1))
          done
          FULL_TAG="${TAG}-${PKGREL}"
          echo "tag=${FULL_TAG}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "pkgrel=${PKGREL}" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD with date version
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.date }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=${{ steps.version.outputs.pkgrel }}/" PKGBUILD
          grep -E '^(pkgver|pkgrel)=' PKGBUILD

      - name: Create and push version tag
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create non-root build user and build package
        run: |
          useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"
          sudo -u builder makepkg --skipinteg -sf --noconfirm

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarchy-branding-package
          path: "*.pkg.tar.zst"
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            Sarchy Branding ${{ steps.version.outputs.tag }}

            Built on: ${{ steps.version.outputs.date }}
            Package: `sarchy-branding-${{ steps.version.outputs.date }}-${{ steps.version.outputs.pkgrel }}-any.pkg.tar.zst`
          files: "*.pkg.tar.zst"
          generate_release_notes: false
