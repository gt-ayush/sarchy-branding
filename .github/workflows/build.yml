name: Build and Release sarchy-branding

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm --needed base-devel git fakeroot

      - name: Configure git user (gt-ayush)
        run: |
          git config user.name "gt-ayush"
          git config user.email "gt-ayush@outlook.com"

      - name: Extract version from PKGBUILD
        id: version
        run: |
          PKGVER=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
          PKGREL=$(grep '^pkgrel=' PKGBUILD | cut -d= -f2)
          TAG="v${PKGVER}-${PKGREL}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "pkgver=${PKGVER}" >> $GITHUB_OUTPUT
          echo "pkgrel=${PKGREL}" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check-tag
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push version tag
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create non-root build user
        run: |
          useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Build package with makepkg
        run: sudo -u builder makepkg --skipinteg -sf
        working-directory: ${{ github.workspace }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarchy-branding-package
          path: |
            *.pkg.tar.zst
          retention-days: 30

      - name: Create GitHub Release
        if: steps.check-tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            Sarchy Branding ${{ steps.version.outputs.tag }}

            Assets:
            - `sarchy-branding-${{ steps.version.outputs.pkgver }}-${{ steps.version.outputs.pkgrel }}-any.pkg.tar.zst`
          files: |
            *.pkg.tar.zst
          generate_release_notes: false
