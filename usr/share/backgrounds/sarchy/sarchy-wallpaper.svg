<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="50%" stop-color="#121830"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2a3a5c" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#121830" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0b1021" stop-opacity="0"/>
    </radialGradient>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Arch-inspired swoosh (subtle) -->
  <path d="M 760 920 Q 960 1120 1160 920 T 1560 920" fill="none" stroke="#1d2a4a" stroke-width="14" stroke-linecap="round"/>
  <path d="M 760 920 Q 960 760 1160 920 T 1560 920" fill="none" stroke="#1d2a4a" stroke-width="10" stroke-linecap="round" opacity="0.5"/>

  <!-- Big S logo -->
  <g filter="url(#softglow)">
    <path d="M 960 420
             C 1060 420 1140 460 1140 540
             C 1140 620 1060 660 960 660
             C 860 660 780 620 780 540
             C 780 460 860 420 960 420 Z
             M 1000 540
             C 1000 480 940 440 870 440
             C 800 440 740 480 740 540
             C 740 600 800 640 870 640
             C 940 640 1000 600 1000 540 Z"
          fill="#ffffff"/>
  </g>

  <!-- Wordmark -->
  <text x="960" y="720" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="110" font-weight="bold" fill="#ffffff" letter-spacing="12">SARCHY</text>
  <text x="960" y="780" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#8aa0c8" letter-spacing="6">arch based  ·  keep it simple</text>

  <!-- Footer -->
  <text x="960" y="1040" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#4a5a7a" letter-spacing="2">sarchy-branding  ·  https://github.com/gt-ayush/Sarchy-iso</text>
</svg>
